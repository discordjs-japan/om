name: Ensure bundled npm version

on:
  pull_request:
    paths:
      - package.json

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  node-bundled-npm:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - id: setup
        name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: "package.json"
          package-manager-cache: false
      - id: npm
        shell: bash -xe {0}
        run: echo "npm_version=$(npm --version)" >> "${GITHUB_OUTPUT}"
      - run: npm install --package-lock-only
      - shell: bash -xe {0}
        env:
          NPM_VERSION: ${{ steps.npm.outputs.npm_version }}
        run: |
          sed --in-place --regexp-extended 's/"npm": "[0-9]+\.[0-9]+\.[0-9]+"/"npm": "'"${NPM_VERSION}"'"/g' .renovaterc.json
      - name: Commit changes
        uses: suzuki-shunsuke/commit-action@5eaa5ecce3ffe93d09a85b946dc5136e3713b1b7 # v1.1.0
        with:
          commit_message: "chore(renovate): pin constraints.npm to npm v${{ steps.npm.outputs.npm_version }} for node ${{ steps.setup.outputs.node-version }}"
          fail_on_self_push: false
